# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/development/cicd/templates/
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml



stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy


ls-job:       # This job runs in the build stage, which runs first.
  image: gitlab.desy.de:5555/millepede/millepede-ii/mp2dev_base
  stage: build
  script:
    - ls /cvmfs/sft.cern.ch/

build-job:       # This job runs in the build stage, which runs first.
  image: gitlab.desy.de:5555/millepede/millepede-ii/mp2dev_base
  stage: build
  script:
    - mkdir build install
    - cd build  
    - cmake -DCMAKE_INSTALL_PREFIX=../install -DBUILD_TESTS=on ../ 
    - make 
    - make install
    - echo "Compile complete."
  artifacts: 
    name: "mille_installation"
    paths:
      - install/
      - build/ 

build-noROOT:       
  image: gitlab.desy.de:5555/millepede/millepede-ii/mp2dev_base
  stage: build
  script:
    - mkdir build install
    - cd build  
    - cmake -DCMAKE_INSTALL_PREFIX=../install -DSUPPORT_ROOT=off -DBUILD_TESTS=on ../ 
    - make 
    - make install
    - echo "Compile complete."
  artifacts: 
    name: "mille_installation_noROOT"
    paths:
      - install/
      - build/ 

build-noROOT-noLZ:       
  image: gitlab.desy.de:5555/millepede/millepede-ii/mp2dev_base
  stage: build
  script:
    - mkdir build install
    - cd build  
    - cmake -DCMAKE_INSTALL_PREFIX=../install -DSUPPORT_ROOT=off -DSUPPORT_ZLIB=off -DBUILD_TESTS=on ../ 
    - make 
    - make install
    - echo "Compile complete."
  artifacts: 
    name: "mille_installation_noROOT_noLZ"
    paths:
      - install/
      - build/ 

doc-job:     
  image: gitlab.desy.de:5555/millepede/millepede-ii/mp2dev_base 
  stage: build
  script:
    - mkdir build
    - cd build  
    - cmake -DCMAKE_INSTALL_PREFIX=../install ../ 
    - make doc   
    - echo "Doc complete."
    - cp -r doc/buildDoc/html ../public
  artifacts: 
    name: "Doc"
    paths:
      - public/
    expose_as: "Documentation"


unit-tests: 
  stage: test
  image: gitlab.desy.de:5555/millepede/millepede-ii/mp2dev_base
  needs: 
    - build-job
  script: 
    - ls 
    - cd build 
    - ctest -V

unit-tests-noROOT: 
  stage: test
  image: gitlab.desy.de:5555/millepede/millepede-ii/mp2dev_base
  needs: 
    - build-noROOT
  script: 
    - ls 
    - cd build 
    - ctest -V

unit-tests-noROOT-noLZ: 
  stage: test
  image: gitlab.desy.de:5555/millepede/millepede-ii/mp2dev_base
  needs: 
    - build-noROOT-noLZ
  script: 
    - ls 
    - cd build 
    - ctest -V

pages:
  stage: deploy
  needs: 
    - doc-job
  script:
    - ls -l public
  artifacts:
    paths:
      - public
  only:
    - main
